# Performance smoke test on pull requests.
# Boots each IAM backend from its published image, seeds it, and runs short
# k6 scenarios to catch broken endpoints and obvious regressions.

name: Performance Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ferriskey_version:
        description: 'FerrisKey image tag (ghcr.io/ferriskey/ferriskey-api)'
        required: false
        default: 'latest'
      keycloak_version:
        description: 'Keycloak image tag (quay.io/keycloak/keycloak)'
        required: false
        default: '26.8.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: ferriskey
            service: ferriskey-api
            base_url: http://localhost:3333
          - provider: keycloak
            service: keycloak
            base_url: http://localhost:8080

    env:
      IAM_PROVIDER: ${{ matrix.provider }}
      BASE_URL: ${{ matrix.base_url }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      COMPOSE_PROFILES: ${{ matrix.provider }}
      FERRISKEY_VERSION: ${{ github.event.inputs.ferriskey_version || 'latest' }}
      KEYCLOAK_VERSION: ${{ github.event.inputs.keycloak_version || '26.8.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start ${{ matrix.provider }}
        run: docker compose up -d --wait

      - name: Wait for the server
        run: scripts/wait_for_iam.sh

      - name: Seed test data
        run: uv run python scripts/seed_test_data.py
        env:
          USER_COUNT: 20

      - name: Smoke test - Token endpoint
        id: token
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=5 --env DURATION=30s \
            --out json=results/token_smoke.json \
            k6/scenarios/token_client_credentials.js

      - name: Smoke test - JWKS endpoint
        id: jwks
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=5 --env DURATION=30s \
            --out json=results/jwks_smoke.json \
            k6/scenarios/jwks.js

      - name: Smoke test - Mixed workload
        id: mixed
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=10 --env DURATION=1m \
            --out json=results/mixed_smoke.json \
            k6/scenarios/mixed_workload.js

      - name: Server logs
        if: always()
        run: docker compose logs --no-color ${{ matrix.service }} > results/${{ matrix.service }}.log

      - name: Stop ${{ matrix.provider }}
        if: always()
        run: docker compose down -v

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results-${{ matrix.provider }}
          path: results/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## Performance Smoke Test (${{ matrix.provider }})"
            echo ""
            echo "| Test | Status |"
            echo "|------|--------|"
            echo "| Token (client_credentials) | ${{ steps.token.outcome }} |"
            echo "| JWKS | ${{ steps.jwks.outcome }} |"
            echo "| Mixed workload | ${{ steps.mixed.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.token.outcome }}" != "success" ] || \
             [ "${{ steps.jwks.outcome }}" != "success" ] || \
             [ "${{ steps.mixed.outcome }}" != "success" ]; then
            echo "::error::At least one smoke scenario failed (see k6 output above)"
            exit 1
          fi
