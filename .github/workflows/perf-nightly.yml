# Nightly performance run.
# Longer load tests per scenario plus a mixed-workload soak, with memory
# growth tracking of the IAM container to spot leaks.

name: Performance Nightly

on:
  schedule:
    # 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ferriskey_version:
        description: 'FerrisKey image tag (ghcr.io/ferriskey/ferriskey-api)'
        required: false
        default: 'latest'
      keycloak_version:
        description: 'Keycloak image tag (quay.io/keycloak/keycloak)'
        required: false
        default: '26.8.1'
      test_duration:
        description: 'Duration of each load test (e.g. 5m, 30m, 1h)'
        required: false
        default: '5m'
      soak_duration:
        description: 'Duration of the mixed-workload soak test'
        required: false
        default: '10m'

jobs:
  nightly-performance:
    name: Nightly (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: ferriskey
            service: ferriskey-api
            base_url: http://localhost:3333
          - provider: keycloak
            service: keycloak
            base_url: http://localhost:8080

    env:
      IAM_PROVIDER: ${{ matrix.provider }}
      BASE_URL: ${{ matrix.base_url }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      COMPOSE_PROFILES: ${{ matrix.provider }}
      FERRISKEY_VERSION: ${{ github.event.inputs.ferriskey_version || 'latest' }}
      KEYCLOAK_VERSION: ${{ github.event.inputs.keycloak_version || '26.8.1' }}
      TEST_DURATION: ${{ github.event.inputs.test_duration || '5m' }}
      SOAK_DURATION: ${{ github.event.inputs.soak_duration || '10m' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start ${{ matrix.provider }}
        run: docker compose up -d --wait

      - name: Wait for the server
        run: scripts/wait_for_iam.sh

      - name: Seed test data
        run: uv run python scripts/seed_test_data.py
        env:
          USER_COUNT: 200

      - name: Record baseline memory and start sampling
        run: |
          baseline_kb=$(scripts/container_memory_kb.sh ${{ matrix.service }})
          echo "BASELINE_KB=$baseline_kb" >> "$GITHUB_ENV"
          echo "Baseline memory: ${baseline_kb} KiB"

          echo "timestamp,rss_kb" > results/memory_samples.csv
          (
            while true; do
              echo "$(date +%s),$(scripts/container_memory_kb.sh ${{ matrix.service }} 2>/dev/null || echo 0)" >> results/memory_samples.csv
              sleep 10
            done
          ) &
          echo $! > /tmp/memmon.pid

      - name: Load test - Token endpoint
        id: token
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=50 --env DURATION="$TEST_DURATION" \
            --out json=results/token_load.json \
            k6/scenarios/token_client_credentials.js

      - name: Load test - Password grant
        id: password
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=30 --env DURATION="$TEST_DURATION" \
            --out json=results/password_load.json \
            k6/scenarios/token_password.js

      - name: Load test - JWKS
        id: jwks
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=50 --env DURATION="$TEST_DURATION" \
            --out json=results/jwks_load.json \
            k6/scenarios/jwks.js

      - name: Load test - Userinfo
        id: userinfo
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=30 --env DURATION="$TEST_DURATION" \
            --out json=results/userinfo_load.json \
            k6/scenarios/userinfo.js

      - name: Soak test - Mixed workload
        id: soak
        continue-on-error: true
        run: |
          set -a && source .env.test && set +a
          k6 run \
            --env VUS=30 --env DURATION="$SOAK_DURATION" \
            --out json=results/mixed_soak.json \
            k6/scenarios/mixed_workload.js

      - name: Check memory growth
        id: memory
        run: |
          kill "$(cat /tmp/memmon.pid)" 2>/dev/null || true

          final_kb=$(scripts/container_memory_kb.sh ${{ matrix.service }})
          baseline_kb=$BASELINE_KB
          growth_pct=$(( (final_kb - baseline_kb) * 100 / baseline_kb ))

          echo "Baseline memory: ${baseline_kb} KiB"
          echo "Final memory: ${final_kb} KiB"
          echo "Memory growth: ${growth_pct}%"

          echo "FINAL_KB=$final_kb" >> "$GITHUB_ENV"
          echo "GROWTH_PCT=$growth_pct" >> "$GITHUB_ENV"

          echo "baseline_kb,final_kb,growth_pct" > results/memory_analysis.csv
          echo "${baseline_kb},${final_kb},${growth_pct}" >> results/memory_analysis.csv

          if [ "$growth_pct" -gt 50 ]; then
            echo "::warning::Memory grew by ${growth_pct}%, above the 50% threshold"
            echo "MEMORY_LEAK_WARNING=true" >> "$GITHUB_ENV"
          fi

      - name: Server logs
        if: always()
        run: docker compose logs --no-color ${{ matrix.service }} > results/${{ matrix.service }}.log

      - name: Stop ${{ matrix.provider }}
        if: always()
        run: docker compose down -v

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-${{ matrix.provider }}-${{ github.run_number }}
          path: results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Nightly Performance (${{ matrix.provider }})"
            echo ""
            echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**FerrisKey image:** $FERRISKEY_VERSION, **Keycloak image:** $KEYCLOAK_VERSION"
            echo ""
            echo "### Memory"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Baseline | ${BASELINE_KB:-n/a} KiB |"
            echo "| Final | ${FINAL_KB:-n/a} KiB |"
            echo "| Growth | ${GROWTH_PCT:-n/a}% |"
            if [ "${MEMORY_LEAK_WARNING:-}" = "true" ]; then
              echo ""
              echo ":warning: Potential memory leak: growth above 50%"
            fi
            echo ""
            echo "### Scenarios"
            echo "| Test | Status |"
            echo "|------|--------|"
            echo "| Token (client_credentials) | ${{ steps.token.outcome }} |"
            echo "| Token (password) | ${{ steps.password.outcome }} |"
            echo "| JWKS | ${{ steps.jwks.outcome }} |"
            echo "| Userinfo | ${{ steps.userinfo.outcome }} |"
            echo "| Mixed workload soak | ${{ steps.soak.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          for outcome in "${{ steps.token.outcome }}" "${{ steps.password.outcome }}" \
                         "${{ steps.jwks.outcome }}" "${{ steps.userinfo.outcome }}" \
                         "${{ steps.soak.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::At least one scenario failed (see k6 output above)"
              exit 1
            fi
          done
