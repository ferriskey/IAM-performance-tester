# FerrisKey chart values for the benchmark. Image tag is set by bench.sh (FERRISKEY_TAG).
# Resources are overridden by bench.sh (FERRISKEY_CPU, FERRISKEY_CPU_LIMIT, FERRISKEY_MEMORY).
postgresql:
  enabled: false

database:
  host: ferriskey-db-rw
  port: 5432
  name: ferriskey
  user: ferriskey
  passwordSecret:
    create: false
    name: ferriskey-db-app
    key: password

webapp:
  replicas: 0

api:
  replicas: 1
  # Since 4a964dd the API refuses to start with an empty ALLOWED_ORIGINS (chart 0.9.0 default).
  server:
    allowedOrigins: ["http://localhost"]
  log:
    filter: info
  admin:
    passwordSecret:
      create: true
  resources:
    requests: { cpu: "2", memory: 1536Mi }
    limits: { memory: 1536Mi }  # CPU limit set by bench.sh when FERRISKEY_CPU_LIMIT is not empty
  nodeSelector:
    bench.ferriskey.rs/role: sut
  tolerations:
    - { key: bench.ferriskey.rs/role, operator: Equal, value: sut, effect: NoSchedule }
  serviceMonitor:
    enabled: true
    interval: 5s
    scrapeTimeout: 5s
